name: 🚀 Deploy Portfolio 3D Mekontso

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy to o2switch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies & Build
        run: |
          npm ci
          npm run build

      - name: Get runner public IP
        id: ip
        run: |
          IP=""
          for url in "https://api.ipify.org" "https://ifconfig.me/ip" "https://checkip.amazonaws.com"; do
            for attempt in 1 2 3; do
              IP=$(curl -s -m 10 "$url" || true)
              IP=$(echo "$IP" | tr -d '[:space:]')
              if [[ "$IP" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                break 2
              fi
              echo "Tentative $attempt sur $url a échoué, nouvel essai..."
              sleep 3
            done
          done
          if [[ -z "$IP" ]]; then
            echo "Impossible de récupérer l'IP publique du runner après plusieurs tentatives" >&2
            exit 1
          fi
          echo "ipv4=$IP" >> "$GITHUB_OUTPUT"
          echo "IP publique du runner : $IP"

      - name: Whitelist GitHub Actions IP on o2switch
        run: |
          curl -sm 45 -H "Authorization: cpanel ${{ secrets.CPANEL_USERNAME }}:${{ secrets.CPANEL_API_TOKEN }}" \
          "https://${{ secrets.CPANEL_SERVER }}:2083/execute/SshWhitelist/add?address=${{ steps.ip.outputs.ipv4 }}&port=22"

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "StrictHostKeyChecking no" >> ~/.ssh/config

      - name: Sync dist/ via rsync
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -p ${{ secrets.SSH_PORT }}" \
            dist/ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.REMOTE_PATH }}

      - name: Remove GitHub Actions IP from whitelist
        if: always()
        run: |
          curl -sm 45 -H "Authorization: cpanel ${{ secrets.CPANEL_USERNAME }}:${{ secrets.CPANEL_API_TOKEN }}" \
          "https://${{ secrets.CPANEL_SERVER }}:2083/execute/SshWhitelist/remove_all"
